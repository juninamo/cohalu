url: https://juninamo.github.io/cohalu/

template:
  bootstrap: 5
  bslib:
    primary: "#2a78d6"
    link-color: "#1f5fae"
    code-color: "#8a3b12"
    border-radius: 0.4rem
    btn-border-radius: 0.4rem
  includes:
    in_header: |
      <meta name="description" content="COHALU: calibrated co-localization for spatial transcriptomics: neighbourhood enrichment, local hotspots, patient-level case-control and paired comparison, and segmentation-free analysis of transcript coordinates.">

home:
  title: "COHALU: CO-localization, Hotspots And sample-Level Units"
  sidebar:
    structure: [links, license, citation, authors, dev]

navbar:
  structure:
    left: [reference, tutorials, articles, news]
    right: [search, github]
  components:
    tutorials:
      text: Tutorials
      menu:
      - text: "Single-sample analysis"
      - text: "Simulation data: SNA & sCLS"
        href: articles/SNA_tutorial_simulation.html
      - text: "10x Xenium data: SNA & sCLS"
        href: articles/SNA_tutorial_10Xdata.html
      - text: "---------"
      - text: "Multi-sample analysis"
      - text: "Case-control comparison"
        href: articles/case_control_tutorial.html
      - text: "---------"
      - text: "Transcript-level (experimental)"
      - text: "Segmentation-free co-localization"
        href: articles/segmentation_free_tutorial.html
    articles:
      text: Methods
      menu:
      - text: "Algorithm reference"
        href: articles/algorithms.html

articles:
- title: Tutorials
  navbar: ~
  desc: >
    End-to-end walkthroughs with code, output and figures.
  contents:
  - articles/SNA_tutorial_simulation
  - articles/SNA_tutorial_10Xdata
  - articles/case_control_tutorial
  - articles/segmentation_free_tutorial
- title: Methods
  desc: >
    Mathematical description of every core function.
  contents:
  - algorithms

reference:
- title: Simulation
  desc: >
    Generate synthetic tissues with a planted cell-cell interaction, and
    convert them to Seurat objects.
  contents:
  - generate_sim
  - generate_sim_groups
  - sim_to_seurat
- title: Single-sample analysis
  desc: >
    Spatial neighborhood analysis (SNA), spatial co-localization score (sCLS),
    radius-based co-occurrence and interaction spots for one tissue.
  contents:
  - nhood_enrichment
  - plot_nhood_heatmap
  - nhood_enrichment.Seurat
  - cooccur_local
  - cooccur_local.Seurat
  - cooccur_local_oe
  - calc_co_occurrence_for_radius
  - compute_co_occurrence_ratio
  - search_interaction_spot
- title: Multi-sample scores
  desc: >
    Compute a score per image (or patient) and return a tidy table ready for
    group comparison.
  contents:
  - build_sample_design
  - nhood_enrichment_per_sample
  - cooccur_ratio_per_sample
  - cooccur_local_per_sample
  - interaction_spot_per_sample
  - summarize_by_patient
- title: Segmentation-free analysis (experimental)
  desc: >
    Work directly on transcript coordinates: bin transcripts, estimate the
    cross pair correlation of gene sets model-free, or fit a random-feature
    log-Gaussian Cox process factor model (after Gundersen et al. 2021).
  contents:
  - read_xenium_transcripts
  - bin_transcripts
  - pcf_cross
  - pcf_matrix
  - colocalization_gene_matrix
  - colocalization_modules
  - colocalization_submodules
  - module_enrichment
  - module_enrichr
  - rff_programs
  - fit_spatial_rff
  - rff_fields
  - rff_offset
  - rff_factor_test
  - rff_program_test
  - fit_spatial_rff_joint
  - rff_program_test_joint
  - rff_expected_offset
  - rff_report
  - rff_pair_correlation
  - colocalization_per_sample
  - simulate_transcripts
  - simulate_transcripts_groups
  - lgcp_true_pair_correlation
- title: Group comparison
  desc: Test every cell-type pair between two groups.
  contents:
  - compare_groups
  - associate_continuous
- title: Visualization
  contents:
  - plot_group_delta_heatmap
  - plot_pair_boxplot
  - plot_volcano_groups
  - manual_colors
- title: Low-level helpers
  contents:
  - compute_count
  - permute_clusters
